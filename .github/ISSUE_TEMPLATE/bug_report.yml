name: Bug report
description: Something in the game doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a match as Red
        2. Play Credential Phishing targeting …
        3. …
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Game mode
      options: [Versus computer, Play a friend, Tutorial, Card library / field guide, Other]
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Firefox 140 on Windows 11, Safari on iPhone 15
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console errors

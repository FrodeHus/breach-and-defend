name: Publish game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Queue deployments rather than interrupting one already publishing.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    name: Test and package game
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      # This buildless game has no dependencies to install.
      - name: Run game tests
        run: npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload game files
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publish game
    needs: prepare
    # Manual runs from other branches must not replace the live game.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
